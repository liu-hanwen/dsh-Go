name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0-jev)'
        required: true
        default: 'v0.1.0-jev'

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: feat/jev-integration
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Write local.properties
        working-directory: app
        run: printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64
      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          name: 'DSH Go ${{ inputs.tag }} — Jev Integration'
          body: |
            ## Jev Integration Build

            Built from `feat/jev-integration` branch.

            ### Changes
            - New `act_goal` MCP tool: DeepSeek specifies a local goal; Jev decision model selects elements and executes step-by-step
            - New Jev settings: API URL, API key (Keystore-backed), confidence threshold
            - Automatic fallback to DeepSeek direct control when Jev confidence is below threshold
          files: app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          draft: false
          prerelease: true
